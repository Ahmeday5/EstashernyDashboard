<div class="ds-page">

  <div class="ds-header">
    <h1 class="ds-title">الخصومات</h1>
    <p class="ds-subtitle">تطبيق خصم على مواعيد دكتور في تاريخ محدد</p>
  </div>

  @if (loading) {
  <div class="ds-loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">جاري التحميل...</span>
    </div>
  </div>
  }

  @if (nospecialitiesMessage && !loading) {
  <div class="alert alert-warning">{{ nospecialitiesMessage }}</div>
  }

  @if (!loading && !nospecialitiesMessage) {
  <div class="ds-form-card">
    <form #form="ngForm" (ngSubmit)="handleSubmit()" class="needs-validation" novalidate>
      <div class="ds-field">
        <label for="doctorId" class="ds-label">الدكتور</label>
        <select class="form-select" id="doctorId" name="doctorId" [(ngModel)]="discount.doctorId" required
          #doctorId="ngModel">
          <option value="" disabled selected>اختر الدكتور</option>
          @for (doctor of doctorAndSpecialities; track doctor.id) {
          <option [value]="doctor.id">{{ doctor.name }} - {{ doctor.specialization }}</option>
          }
        </select>
        <div class="invalid-feedback">يرجى اختيار الدكتور</div>
      </div>

      <div class="ds-field-row">
        <div class="ds-field">
          <label for="date" class="ds-label">التاريخ</label>
          <input type="date" id="date" class="form-control" name="date" [(ngModel)]="discount.date" required
            #date="ngModel" />
          <div class="invalid-feedback">يرجى إدخال تاريخ</div>
        </div>

        <div class="ds-field">
          <label for="discountPercentage" class="ds-label">نسبة الخصم (%)</label>
          <input type="number" id="discountPercentage" class="form-control" name="discountPercentage"
            [(ngModel)]="discount.discountPercentage" placeholder="55" required #discountPercentage="ngModel" min="1"
            max="100" />
          <div class="invalid-feedback">يرجى إدخال نسبة خصم صحيحة (1-100)</div>
        </div>
      </div>

      <div class="ds-submit">
        <button class="ds-submit-btn" type="submit" [disabled]="loading">
          <i class="fa-solid fa-percent"></i> حفظ الخصم
        </button>
      </div>
    </form>
  </div>
  }

</div>
