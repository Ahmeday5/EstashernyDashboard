<div class="sp-page">

  <div class="sp-header">
    <h1 class="sp-title">التخصصات</h1>
    <p class="sp-subtitle">إدارة التخصصات الطبية المتاحة على المنصة</p>
  </div>

  <!-- Add form -->
  <div class="sp-form-card">
    <h2 class="sp-form-title">إضافة تخصص جديد</h2>
    <form #form="ngForm" (ngSubmit)="handleSubmit()" class="needs-validation" novalidate>
      <div class="sp-form-row">
        <div class="sp-field">
          <label class="sp-label">اسم التخصص</label>
          <input type="text" id="validationCustom01" class="form-control" placeholder="اسم التخصص" name="name"
            [(ngModel)]="Specialty.name" required #name="ngModel" />
          <div class="invalid-feedback">يرجى إدخال اسم التخصص</div>
        </div>
        <div class="sp-field">
          <label class="sp-label">لينك صورة التخصص</label>
          <input type="text" id="imageUrlInput" class="form-control" placeholder="لينك صورة التخصص" name="imageUrl"
            [(ngModel)]="Specialty.imageUrl" required #imageUrl="ngModel" />
          <div class="invalid-feedback">يرجى إدخال صورة التخصص</div>
        </div>
        <button class="sp-add-btn" type="submit">
          <i class="fa-solid fa-plus"></i> إضافة
        </button>
      </div>
    </form>
  </div>

  @if (loading) {
  <div class="sp-loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  } @else if (nospecialitiesMessage) {
  <div class="sp-empty">
    <i class="fa-solid fa-stethoscope"></i>
    <p>{{ nospecialitiesMessage }}</p>
  </div>
  } @else {
  <div class="sp-grid" [@staggerIn]="specialities.length">
    @for (Specialty of specialities; track Specialty.id) {
    <div class="sp-card">
      <button type="button" class="sp-delete-btn" (click)="deleteSpeciality(Specialty.id)" title="حذف">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <img [src]="Specialty.imageUrl" alt="{{ Specialty.name }}" class="sp-card-img" />
      <span class="sp-card-name">{{ Specialty.name }}</span>
    </div>
    }
  </div>
  }

</div>
