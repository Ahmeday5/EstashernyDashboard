<div class="pp-page">

  <div class="pp-header">
    <div>
      <h1 class="pp-title">سياسة الخصوصية</h1>
      <p class="pp-subtitle">عرض وتعديل صفحات السياسات المعروضة للمستخدمين</p>
    </div>
    <button class="pp-edit-btn" data-bs-toggle="modal" data-bs-target="#editModal" (click)="openModal(selectedPageType)">
      <i class="fa-solid fa-pen"></i> تعديل المحتوى
    </button>
  </div>

  <div class="pp-toolbar">
    <label for="pageSelect" class="pp-toolbar-label">اختر الصفحة للعرض</label>
    <select id="pageSelect" class="form-select pp-select" [ngModel]="selectedPageType" (ngModelChange)="selectedPageTypeChanged($event)">
      <option [value]="1">خصوصية الدكاترة</option>
      <option [value]="2">خصوصية المرضى</option>
    </select>
  </div>

  @if (loading) {
  <div class="pp-loading">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
  } @else {
  <div class="pp-content-card" [innerHTML]="content"></div>
  }

  <!-- Modal Bootstrap -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content pp-modal" *ngIf="editorContent !== null">
        <div class="modal-header pp-modal-header">
          <h5 class="modal-title">تعديل الصفحة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div *ngIf="editorContent !== null && editorContent !== undefined; else loadingEditor">
            <ckeditor [editor]="Editor" [(ngModel)]="editorContent" [config]="{height: '600px'}">
            </ckeditor>
          </div>
          <ng-template #loadingEditor>
            <div class="d-flex justify-content-center my-4">
              <div class="spinner-border text-primary" role="status"></div>
            </div>
          </ng-template>
        </div>
        <div class="modal-footer pp-modal-footer">
          <button type="button" class="pp-btn pp-btn--ghost" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="pp-btn pp-btn--solid" [disabled]="updating" (click)="saveContent()">
            @if (updating) {
            <span class="spinner-border spinner-border-sm"></span>
            } @else {
            <i class="fa-solid fa-check"></i>
            }
            حفظ
          </button>
        </div>
      </div>
      <div *ngIf="editorContent === null" class="d-flex justify-content-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </div>
</div>
