<div class="content-wrapper">
  @if (isLoggedIn$ | async) {
  <app-sidebar></app-sidebar>
  }
  <main class="content" [class.content--collapsed]="layout.collapsed()" [class.full-width]="!(isLoggedIn$ | async)">
    @if (isLoggedIn$ | async) {
    <app-header></app-header>
    }
    <div class="content-body" [@routeAnimation]="getRouteAnimationKey(outlet)">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>
  </main>
</div>

<app-confirm-modal></app-confirm-modal>
